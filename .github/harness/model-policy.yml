# 許容値集合の検査対象外)。表示名は未照合。
external_models:
  gpt-6-astra: {copilot_display: null}
  gemini-3.8-flash: {copilot_display: null}
  mai-code-1.1-flash: {copilot_display: null}

# Copilot の「子は親のコストティアを超えられない」制約(VS Code は起動拒否、CLI は無言降格 #2758)の
# 順序仮説。確定表は公開されていない(価格順の推定)。MP-8 の実機実験で verified_* を埋める。
tier_order_hypothesis:
  order: [fable-5.1, gpt-6-astra, opus-5, sonnet-4, sonnet-5, haiku-4.5, gemini-3.8-flash, mai-code-1.1-flash]
  basis: "価格順の仮説(確定表は非公開)"
  verified_on: null
  verified_with: null                    # 例: "copilot-cli 1.0.83 / VS Code 1.137"

# 役割(policy.roles のキー = .github/agents/*.agent.md の basename 集合)。
#   kind: subagent = .claude/agents/<role>.md に生成される(3 本)。
#   kind: phase / maintainer = Claude Code では commands 経由で読む役割定義で、claude_code.* の
#         生成先は無い(文書のみ。phase_overrides で /NN コマンドに effort を書く経路だけがある)。
#   claude_code.model: alias / フル ID / inherit。effort: inherit / low / medium / high / xhigh / max。
#   claude_code.allowed_models: null = policy.models から enforcement.deny_agent_model を除いた全て
#   (guard-subagent-model の許可集合。A/B 後に役割ごとに絞る)。
#   copilot_vscode.model: null = ピッカー継承(auto は書かない) / [model キー…] = 表示名配列に変換して生成。
#   copilot_cli.model: 単一文字列(settings.json 側は配列不可)。effortLevel: low / medium / high / xhigh(max 無し)。
#   never_low: true = effort low / medium を方針として禁止(validate が高 effort 以外を WARN)。
#   ab_evidence: null の間は既定固定。A/B の結果ファイル(evaluation/results/<file>)を入れて初めて model/effort を変える。
roles:
  orchestrator:
    kind: phase
    purpose: "進捗ルーター(/00・/99)。書かない。公式文献の orchestrator(lead)ではない(MS-8)"
    invokes: []
    claude_code: {model: inherit, effort: inherit}
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: false
    ab_candidate: "medium / low(判断は GATE_STATUS の機械読取が主。low で progress.md を読まずに答える副作用に注意)"
    rationale: ["監査 2026-09-09 §4.2", D040]
    ab_evidence: null
  requirements:
    kind: phase
    purpose: "上流(要件)。全後工程が依存するため effort high を下限に固定"
    invokes: [spec-critic]
    claude_code: {model: inherit, effort: high}   # 生成先なし(phase_overrides で /01・/02 に書ける。既定は空)
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: true
    ab_candidate: "変更なし(上流コストの主因は継続セッションの cache_read。対策は分割=D057 と往復削減)"
    rationale: ["監査 2026-09-09 §4.2", D057]
    ab_evidence: null
  design:
    kind: phase
    purpose: "上流(設計)。全後工程が依存するため effort high を下限に固定"
    invokes: [spec-critic]
    claude_code: {model: inherit, effort: high}   # 生成先なし(phase_overrides で /03・/04 に書ける。既定は空)
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: true
    ab_candidate: "変更なし"
    rationale: ["監査 2026-09-09 §4.2"]
    ab_evidence: null
  implement:
    kind: phase
    purpose: "コーディネーター(公式文献の lead)。分解・統合・escalate 判断。reviewer は完了タスク 10 個ごと+全完了時(A6-14)"
    invokes: [task-worker, reviewer]
    claude_code: {model: inherit, effort: inherit}
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: false
    ab_candidate: "medium(第2段。低 effort の executor は相談率が崩壊し escalate 条項が無効化される恐れ)"
    rationale: ["監査 2026-09-09 §4.2"]
    ab_evidence: null
  test:
    kind: phase
    purpose: "コーディネーター(lead)。reviewer を起動する側"
    invokes: [reviewer]
    claude_code: {model: inherit, effort: inherit}
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: false
    ab_candidate: "medium(第2段)"
    rationale: ["監査 2026-09-09 §4.2"]
    ab_evidence: null
  release:
    kind: phase
    purpose: "不可逆操作。節約する場面ではない(ask ガードが担う)。計画→独立検証(reviewer)→承認→実行の権限分離(codex C-02 / IA-20260831-02)"
    invokes: [reviewer]
    claude_code: {model: inherit, effort: inherit}
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: false
    ab_candidate: "変更なし"
    rationale: ["監査 2026-09-09 §4.2"]
    ab_evidence: null
  change:
    kind: phase
    purpose: "運用中の変更請求(/12)のコーディネーター(lead)"
    invokes: [task-worker, reviewer, spec-critic]
    claude_code: {model: inherit, effort: inherit}
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: false
    ab_candidate: "medium(第2段)"
    rationale: ["監査 2026-09-09 §4.2"]
    ab_evidence: null
  harness-maintainer:
    kind: maintainer
    purpose: "ハーネス本体専用の保守(個別プロジェクトでは使わない)"
    invokes: []
    claude_code: {model: inherit, effort: inherit}
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: null}
    never_low: false
    ab_candidate: "対象外"
    rationale: ["監査 2026-09-09 §4.2"]
    ab_evidence: null
  reviewer:
    kind: subagent
    purpose: "独立コードレビュー(読み取り専用)。判定役。release の action packet の独立検証も担う"
    invoked_by: [implement, test, change, release]
    claude_code:
      model: inherit
      effort: high                       # never_low と整合(low / medium は「高確信のみ報告」= 見逃し増、Read が減る)
      maxTurns: null                     # 上限は実測(ターン分布)後に設定する。null = 行を出さない
      background: false                  # 完了時の modelsUsed を PostToolUse で観測するため前面実行(background は async_launched しか取れない)
      memory: null
      allowed_models: null
    copilot_vscode: {model: null}        # 親と同ティア(inherit)。親≧子制約のため「判定役だけ強いモデル」は Copilot では成立しない
    copilot_cli: {model: null, effortLevel: high, contextTier: null}
    never_low: true
    plan_fallbacks: null
    ab_candidate: "変更なし(advisor 実験は別枠)"
    rationale: [D040, D046, D071, "監査 2026-09-09 §4.2"]
    ab_evidence: null
  spec-critic:
    kind: subagent
    purpose: "要件定義書・設計書の独立レビュー(読み取り専用)。判定役"
    invoked_by: [requirements, design, change]
    claude_code:
      model: inherit
      effort: high
      maxTurns: null
      background: false
      memory: null
      allowed_models: null
    copilot_vscode: {model: null}
    copilot_cli: {model: null, effortLevel: high, contextTier: null}
    never_low: true
    plan_fallbacks: null
    ab_candidate: "変更なし"
    rationale: [D040, "監査 2026-09-09 §4.2"]
    ab_evidence: null
  task-worker:
    kind: subagent
    purpose: "1 タスク実装ワーカー(量産)。唯一の節約対象。実運用では総コストの 67〜76%(RD-1)"
    invoked_by: [implement, change]
    claude_code:
      model: inherit
      effort: inherit
      maxTurns: null
      background: null                   # ホスト既定に従う(2.1.232+ は background 既定 = PostToolUse は async_launched)
      memory: null
      allowed_models: null
    copilot_vscode: {model: null}        # Copilot では方向が反転(親を強く・worker を下位ティアに)。MP-8 実測後に配列化
    copilot_cli: {model: null, effortLevel: null, contextTier: null}
    never_low: false
    plan_fallbacks: null
    ab_arms:                             # A3-1 / A6-21 と接続(順序: Arm 0 → C(solo) → A1 → A3 → A2 → B1)
      - "A1: inherit + effort medium"
      - "A2: task-worker-low(effort low) + 固定テスト失敗時は task-worker-high へ再委譲(受入テストを固定検体にしてから)"
      - "B1: sonnet-5 + effort high(A 案最良アームの cost/accepted task を下回り差し戻しが増えない場合のみ)"
    rationale: [D034, D040, "監査 2026-09-09 §4.1-4.3"]
    ab_evidence: null

session:
  copilot_cli_pin: null                  # .github/copilot/settings.json の session model(trusted repo)。null = 出力しない。MP-8 で優先順位確認後に使う

# 工程別オーバーレイ(Claude Code の .claude/commands/<cmd>.md frontmatter に effort を書く)。
# 既定は空: 対話運用では effort を frontmatter に常設しない(GSD v1.11.0 の先例 = Opus 5 では
# セッション内の effort 切替でキャッシュ全損。Fable 5.1 のみ 2.1.260+ で維持)。
# 例: 02-requirements-deepdive: {effort: high}
phase_overrides: {}

enforcement:
  claude_code:
    # permissions.deny に展開する候補外モデル。生成: Agent(model:<alias>) と Agent(model:<フル ID>)。
    # 注意: deny は「呼出時の model パラメータの literal 一致のみ」(公式)。省略時・frontmatter・
    # inherit 由来には効かない。それらは guard-subagent-model(PreToolUse)と実行モデルの記録
    # (PostToolUse / SubagentStop。measure 側 log-subagent.py)が担う。
    deny_agent_model: [haiku-4.5]
    deny_wildcard: false                 # true で Agent(model:<フル ID>*) も生成(公式: 値は * 対応。実機未確認)
    pre_tool_use_role_table: true        # guard-subagent-model.{sh,ps1} の埋め込み表を生成
    post_tool_use_record: log-subagent.py  # 第3層(記録)は measure 側。logs/usage/<sid>.subagents.jsonl
    emit_effort_frontmatter: true        # false にすると .claude/agents に effort 行を出さない(版条件の実機確認前の退避用)
  copilot:
    settings_json: true                  # .github/copilot/settings.json を生成する

hosts:
  claude_code: true
  copilot_vscode: true
  copilot_cli: true
  cloud_agent: false                     # custom agent の model は cloud で未保証(G-2 に反証なし)。SOP のみ、生成物から外す
  antigravity: false                     # 凍結(D057)
