# .github/harness/model-policy.yml — 役割別モデル/effort 方針の唯一の正(v1)
#
# 監査 2026-09-09 §4.5(MP-1〜7 / CC-2 / MS 群)の設計。他の全面は生成物:
#   - .claude/agents/<role>.md の frontmatter(model / effort / maxTurns / background / memory)
#   - .github/agents/<role>.agent.md の `model:` 行のみ(# generated-from マーカー。`auto` は除去)
#   - .github/copilot/settings.json(Copilot CLI。subagents.agents.<name>.{model,effortLevel,contextTier})
#   - .claude/commands/<cmd>.md の `effort:`(phase_overrides。既定は空)
#   - .github/hooks/scripts/guard-subagent-model.{sh,ps1} に埋め込む役割表(JSON)
#   - .claude/settings.json の permissions.deny `Agent(model:…)`(--print-deny / --apply-deny)
#   - PLATFORM.md / README.md / agents.html の対照表(<!-- BEGIN GENERATED: model-policy-* -->)
# 生成: python tools/generate-adapters.py(通常モードで人間が実行。保守モード(.locked)中は
#       settings.json への書込を拒否する)。検査: python tools/generate-adapters.py --check、
#       python tools/validate-harness.py(WARN 既定。--model-policy-strict で ERROR)。
#
# 既定(A/B 前・挙動不変): 全役割 model: inherit。判定役(reviewer / spec-critic)と上流
# (requirements / design)は effort: high + never_low、それ以外は effort: inherit。
# model / effort を変えるのは ab_evidence(evaluation/results/<file>)が入った役割のみ。
#
# 上書き(方針より強い層。PLATFORM.md「モデル/effort の方針」の優先順位表が正):
#   CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1 の環境では roles.*.claude_code.model は全て無効
#   (fork と model: inherit のスキルを除く。v2.1.257+)。
#   CLAUDE_CODE_EFFORT_LEVEL は roles.*.claude_code.effort と phase_overrides を全て上書きする。
version: 1
retrieved: 2026-09-10            # 可用性・価格・廃止日・版条件の取得日(validate: 30日超で WARN)
sources:
  claude_sub_agents: https://code.claude.com/docs/en/sub-agents
  claude_permissions: https://code.claude.com/docs/en/permissions
  claude_model_config: https://code.claude.com/docs/en/model-config
  copilot_cli_config: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference
  copilot_plans: https://raw.githubusercontent.com/github/docs/main/data/tables/copilot/model-supported-plans.yml
  copilot_pricing: https://raw.githubusercontent.com/github/docs/main/data/tables/copilot/models-and-pricing.yml
  anthropic_pricing: https://platform.claude.com/docs/en/about-claude/pricing

# 版条件は「docs 記載版」と「実機検証版」を分ける(docs と CHANGELOG で版数が食い違うため、
# validate の照合は docs 版を正とし、verified は実機で確認した項目だけを埋める)。
# 正の分担(1 行。2026-09-10 A6-8): ホストに要求する版(min / required / 評価装置の起動門)とフック・予算・
# CLI フラグ等ホスト機能の導入版は .github/harness/platform-requirements.json、モデル関連機能の導入版は
# 本ファイルの min_version(JSON は数値を持たず名前で参照する)。doctor / gen-docs は本ブロックを
# PyYAML 無しの regex で読むため、docs: 配下は 2 スペース字下げ・"x.y.z" の引用文字列の書式を保つ
# (yaml 読みとの一致は validate-harness (n) が検査)。
min_version:
  claude_code:
    docs:
      resolved_model: "2.1.174"          # PostToolUse(Agent).tool_response.resolvedModel
      agent_model_deny: "2.1.178"        # permissions `Agent(model:…)` / `Agent(name)`
      model_inherit: "2.1.200"           # frontmatter `model: inherit`
      models_used: "2.1.212"             # tool_response.modelsUsed(完了時のみ)
      tasks_model_display: "2.1.242"     # /tasks にモデル・effort を表示(effort frontmatter 自体の版条件ではない=MS-5 反証)
      resolution_order: "2.1.251"        # 呼出時 > frontmatter > CLAUDE_CODE_SUBAGENT_MODEL > メイン
      subagent_model_force: "2.1.257"    # CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1
      skill_model_interactive: "2.1.259" # skills/commands frontmatter の model が対話で有効
      fable_5_1_effort_cache_keep: "2.1.260"  # Fable 5.1 のみ effort 変更でキャッシュ維持
    effort_frontmatter:
      docs: null                         # 公式 sub-agents docs は effort に版条件を付けていない
      changelog: "2.1.78"                # CHANGELOG 上の記載(2.1.78/80)。設計レビューは 2.1.242 と読んだ=見解が割れている
      verify_how: "実機 2.1.201 で reviewer を起動し、SubagentStop の hooks 入力 effort.level が frontmatter の値になるかで確認する"
    verified: {}                         # 実機で確認した項目のみ {キー: "版"}(開発機 2.1.201)
  copilot_cli:
    docs:
      settings_json_subagents: "1.0.70"  # .github/copilot/settings.json の subagents.agents.<name>
      usage_output_file: "1.0.81"        # --usage-output-file(per-agent usage)
      agent_model_array: "1.0.83"        # .agent.md の model 配列(それ以前は読込エラー #2133)
    verified: {}                         # 開発機は copilot CLI 未導入

