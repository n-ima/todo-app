# ドラフト（TASK-002）。ユーザーが .github/workflows/ci.yml へ配置する。設計: DD-10 §7
# Action のハッシュは 2026-09-27 に `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` で実在を確認済み。
# 注意: global.json で test.runner=Microsoft.Testing.Platform のため、`dotnet test` は --project 指定（MTP 形式）で呼ぶ。
name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # DD-10 §7 どおり ubuntu（Windows ランナーの消費を最小にする。A-024）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build TodoApp.sln -warnaserror
      # E2E（Playwright）は開発機で実行する（A-024）。E2E は別プロジェクトのため対象外
      - run: dotnet test --project tests/TodoApp.Tests --no-build

  secrets:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # gitleaks-action は Docker 前提のため ubuntu（DD-10 §7 どおり）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 組織アカウントのリポジトリでは GITLEAKS_LICENSE が必要（個人アカウントは不要）

  package:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write   # Release への添付
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # パッケージスクリプト（publish → Pester(tests/scripts) → ZIP と SHA-256）は TASK-901 で作成予定で、現時点では存在しない。
      # TASK-901 完了時にスクリプトのパスへ差し替える。
      - shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ github.ref_name }}"
      # Release への添付は gh CLI（ランナー同梱）で行い、追加 Action を増やさない
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --verify-tag
